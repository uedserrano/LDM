<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Sistema de Gestión de Trabajadores</title>
</head>
<body>
    <h1 style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        color: white; 
        text-align: center;
        background: rgb(66, 119, 253);">
        Sistema de Gestión de Trabajadores</h1>
    
    <main class="container">
        <div class="row">
            <div class="col-7">
                <h2 style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                color: white; 
                text-align: center;
                font-size: 25px;
                background: rgb(66, 119, 253);
                border-radius: 5px;
                margin-top: 30px;
                padding: 3px;">
                Formulario</h2>
                <input class="form-control mb-3 mt-3" type="text" placeholder="Nombre" id="input-nombre">
                <input class="form-control mb-3" type="text" placeholder="Apellido" id="input-apellido">
                <input class="form-control mb-3" type="text" placeholder="Correo-Electrónico" id="input-correo">
                <select class="form-select" id="select-departamento">
                <option>IT</option>
                <option>Marketing</option>
                <option>Ventas</option>
                <option>Administración</option>
                </select>
                <button type="button" class="btn btn-primary mt-3 w-100" id="btn-guardar" >Guardar cambios</button>

            </div>

            <div class="col-5">
                <h2 style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                color: white; 
                text-align: center;
                font-size: 25px;
                background: rgb(66, 119, 253);
                border-radius: 5px;
                margin-top: 30px;
                padding: 3px;">
                Nombre y apellidos</h2>
                <ul class="list-group mt-4" id="lista-usuarios">

                </ul>
            </div>

            <div>
                <h2 style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                color: white; 
                text-align: center;
                font-size: 25px;
                background: rgb(66, 119, 253);
                border-radius: 5px;
                margin-top: 30px;
                padding: 3px;">
                Resumen de los trabajadores</h2>
            </div>
            <div class="col-6">
                <h3 style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                color: white; 
                text-align: center;
                font-size: 18px;
                background: rgb(115, 153, 249);
                border-radius: 5px;
                margin-top: 30px;
                padding: 3px;">
                Departamento de IT:</h3>
                <ul class="list-group mt-4" id="lista-usuarios2">
            </div>

            <div class="col-6">
                <h3 style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                color: white; 
                text-align: center;
                font-size: 18px;
                background: rgb(115, 153, 249);
                border-radius: 5px;
                margin-top: 30px;
                padding: 3px;">
                Departamento de Marketing:</h3>
                <ul class="list-group mt-4" id="lista-usuarios3">
            </div>

            <div class="col-6">
                <h3 style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                color: white; 
                text-align: center;
                font-size: 18px;
                background: rgb(115, 153, 249);
                border-radius: 5px;
                margin-top: 30px;
                padding: 3px;">
                Departamento de Ventas:</h3>
                <ul class="list-group mt-4" id="lista-usuarios4">
            </div>


                <div class="col-6">
                <h3 style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                color: white; 
                text-align: center;
                font-size: 18px;
                background: rgb(115, 153, 249);
                border-radius: 5px;
                margin-top: 30px;
                padding: 3px;">
                Departamento de Administración:</h3>
                <ul class="list-group mt-4" id="lista-usuarios5">

            </div>

        </div>
    </main>
    
    <script src=".\index.js"></script>
</body>
</html>
